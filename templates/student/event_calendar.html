{% extends 'student_base.html' %}
{% load static %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<link rel="stylesheet" href="{% static 'css/calendar.css' %}">

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full min-h-screen">
    <div class="text-center mb-8">
        <h1 class="font-bold text-3xl sm:text-4xl text-pup-maroon dark:text-pup-gold uppercase tracking-wide">University Calendar</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-2">Track university-wide schedules and your organization's events.</p>
    </div>

    <div class="bg-white dark:bg-pup-darkcard rounded-3xl shadow-xl border border-gray-200 dark:border-gray-800 p-4 sm:p-8 overflow-hidden transition-colors">
        <div id="calendar" class="min-h-[500px] sm:min-h-[700px]"></div>
    </div>
</div>

<!-- Calendar Modal -->
<div id="calendarModal" class="hidden fixed inset-0 z-[5000] flex items-center justify-center p-4">
    <div id="calendarModalBg" class="fixed inset-0 bg-black/70 backdrop-blur-sm"></div>
    <div class="relative bg-white dark:bg-pup-darkcard rounded-3xl shadow-2xl w-full max-w-md p-8 border border-gray-100 dark:border-gray-800 z-10 font-sans">
        <button id="closeCalModalBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-white transition-colors">
            <i class="ph-bold ph-x text-2xl"></i>
        </button>
        
        <div class="flex items-center gap-3 mb-6">
            <div id="modalCategoryBadge" class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest bg-pup-maroon text-white dark:bg-pup-gold dark:text-black">
                CATEGORY
            </div>
        </div>
        
        <h2 id="calModalTitle" class="text-2xl font-black text-gray-900 dark:text-white mb-4 leading-tight">Event Title</h2>
        
        <div class="space-y-4 mb-8">
            <div class="flex items-center gap-3 text-gray-600 dark:text-gray-300">
                <i class="ph-fill ph-calendar text-2xl text-pup-maroon dark:text-pup-gold"></i>
                <div>
                    <div class="text-[10px] font-bold uppercase text-gray-400">Date & Time</div>
                    <div id="calModalDateTime" class="font-bold">--</div>
                </div>
            </div>
            <div class="flex items-center gap-3 text-gray-600 dark:text-gray-300">
                <i class="ph-fill ph-map-pin text-2xl text-pup-maroon dark:text-pup-gold"></i>
                <div>
                    <div class="text-[10px] font-bold uppercase text-gray-400">Venue</div>
                    <div id="calModalVenue" class="font-bold">--</div>
                </div>
            </div>
        </div>

        <button id="btnViewOnEvents" class="w-full py-4 bg-pup-maroon dark:bg-pup-gold text-white dark:text-black font-black rounded-2xl text-sm transition-all shadow-md hover:scale-[1.02] active:scale-95 uppercase tracking-widest">
            View in Hub
        </button>
    </div>
</div>

<script>
function initCalendarLogic() {
    const calendarEl = document.getElementById('calendar');
    if (!calendarEl) return;

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek'
        },
        themeSystem: 'standard',
        events: [
            { title: 'Research Colloquium', start: '2026-05-12', extendedProps: { category: 'Academic', venue: 'Audio Visual Room', time: '08:00 AM' }, backgroundColor: '#800000', borderColor: '#800000' },
            { title: 'IT Week Hackathon', start: '2026-06-05', extendedProps: { category: 'Academic', venue: 'Computer Lab 1', time: '07:00 AM' }, backgroundColor: '#800000', borderColor: '#800000' },
            { title: 'PUP Intramurals', start: '2026-08-15', end: '2026-08-20', extendedProps: { category: 'Sports', venue: 'University Oval', time: '08:00 AM' }, backgroundColor: '#D4AF37', borderColor: '#D4AF37', textColor: '#000' }
        ],
        eventClick: function(info) {
            const event = info.event;
            document.getElementById('calModalTitle').innerText = event.title;
            document.getElementById('modalCategoryBadge').innerText = event.extendedProps.category;
            document.getElementById('calModalDateTime').innerText = event.start.toLocaleDateString('en-US', { dateStyle: 'long' }) + ' • ' + event.extendedProps.time;
            document.getElementById('calModalVenue').innerText = event.extendedProps.venue;
            
            const modal = document.getElementById('calendarModal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
    });
    calendar.render();

    function closeCalModal() {
        document.getElementById('calendarModal').classList.add('hidden');
        document.body.style.overflow = '';
    }

    const closeBtn = document.getElementById('closeCalModalBtn');
    if(closeBtn) closeBtn.addEventListener('click', closeCalModal);
    
    const bgOverlay = document.getElementById('calendarModalBg');
    if(bgOverlay) bgOverlay.addEventListener('click', closeCalModal);
    
    const viewBtn = document.getElementById('btnViewOnEvents');
    if(viewBtn) viewBtn.addEventListener('click', () => {
        window.location.href = "{% url 'student_school_events' %}";
    });
}

window.addEventListener('load', () => {
    const checkInterval = setInterval(() => {
        if (window.VUE_APP_MOUNTED) {
            clearInterval(checkInterval);
            initCalendarLogic();
        }
    }, 100);
});
</script>
{% endblock content %}
