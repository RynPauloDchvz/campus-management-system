{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | PUPUni-CAMS</title>
    
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pup: {
                            maroon: '#800000',
                            gold: '#D4AF37',
                            darkbg: '#121212',
                            darkcard: '#1e1e1e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-pup-darkbg text-gray-800 dark:text-gray-200 transition-colors duration-300 min-h-screen flex items-center justify-center p-6">

    <div id="app" v-cloak class="w-full max-w-md">
        
        <div class="bg-white dark:bg-pup-darkcard rounded-[2.5rem] shadow-2xl border border-gray-100 dark:border-gray-800 p-8 sm:p-10 relative overflow-hidden">
            
            <!-- THEME TOGGLE -->
            <button @click="toggleTheme" class="absolute top-6 right-6 z-50 text-xl hover:text-pup-maroon dark:hover:text-pup-gold transition-all">
                <i :class="isDark ? 'ph-fill ph-sun' : 'ph-fill ph-moon'"></i>
            </button>

            <!-- BACK TO LOGIN -->
            <a href="/" class="inline-flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-pup-maroon dark:hover:text-pup-gold transition-colors mb-8">
                <i class="ph-bold ph-arrow-left"></i> Back to Login
            </a>

            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-gray-50 dark:bg-[#151515] rounded-full flex items-center justify-center mx-auto mb-6 border border-gray-100 dark:border-gray-800">
                    <i class="ph-fill ph-lock-key-open text-4xl text-pup-maroon dark:text-pup-gold"></i>
                </div>
                <h2 class="text-3xl font-black text-gray-900 dark:text-white tracking-tight mb-2 uppercase">Forgot Password</h2>
                <p class="text-sm text-gray-500 dark:text-gray-400">[[ stepTitle ]]</p>
            </div>

            <!-- STEP 1: IDENTIFIER -->
            <div v-if="step === 1" class="animate-[fadeIn_0.3s_ease-out]">
                <form @submit.prevent="submitIdentifier" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-pup-gold mb-2 uppercase tracking-wider">Student Number / Username</label>
                        <div class="relative">
                            <i class="ph-bold ph-user-focus absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="text" v-model="identifier" required placeholder="Enter your ID or Username" class="w-full pl-11 pr-4 py-4 rounded-2xl bg-gray-50 dark:bg-[#111] border border-gray-200 dark:border-gray-800 focus:outline-none focus:border-pup-maroon dark:focus:border-pup-gold text-gray-800 dark:text-white text-sm transition-all shadow-sm">
                        </div>
                    </div>
                    <button type="submit" :disabled="isLoading" class="w-full py-4 rounded-2xl bg-pup-maroon hover:bg-red-900 dark:bg-pup-gold dark:hover:bg-yellow-600 text-white dark:text-black font-bold text-sm transition-all shadow-lg flex items-center justify-center gap-2 disabled:opacity-70">
                        <i v-if="isLoading" class="ph-bold ph-spinner animate-spin"></i>
                        <span>[[ isLoading ? 'Searching Account...' : 'Continue' ]]</span>
                    </button>
                </form>
            </div>

            <!-- STEP 2: VERIFICATION CODE -->
            <div v-if="step === 2" class="animate-[fadeIn_0.3s_ease-out]">
                <form @submit.prevent="verifyCode" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-pup-gold mb-2 uppercase tracking-wider">Verification Code</label>
                        <div class="relative">
                            <i class="ph-bold ph-shield-check absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="text" v-model="code" required placeholder="Check your email for code" class="w-full pl-11 pr-4 py-4 rounded-2xl bg-gray-50 dark:bg-[#111] border border-gray-200 dark:border-gray-800 focus:outline-none focus:border-pup-maroon dark:focus:border-pup-gold text-gray-800 dark:text-white text-sm transition-all shadow-sm">
                        </div>
                    </div>
                    <button type="submit" :disabled="isLoading" class="w-full py-4 rounded-2xl bg-pup-maroon hover:bg-red-900 dark:bg-pup-gold dark:hover:bg-yellow-600 text-white dark:text-black font-bold text-sm transition-all shadow-lg flex items-center justify-center gap-2 disabled:opacity-70">
                        <i v-if="isLoading" class="ph-bold ph-spinner animate-spin"></i>
                        <span>Verify Code</span>
                    </button>
                    <button type="button" @click="step = 1" class="w-full py-4 text-sm font-bold text-gray-500 hover:text-pup-maroon dark:hover:text-pup-gold transition-colors">Change Username</button>
                </form>
            </div>

            <!-- STEP 3: NEW PASSWORD -->
            <div v-if="step === 3" class="animate-[fadeIn_0.3s_ease-out]">
                <form @submit.prevent="resetPassword" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-pup-gold mb-2 uppercase tracking-wider">New Password</label>
                        <div class="relative">
                            <i class="ph-bold ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="password" v-model="newPassword" required placeholder="••••••••" class="w-full pl-11 pr-4 py-4 rounded-2xl bg-gray-50 dark:bg-[#111] border border-gray-200 dark:border-gray-800 focus:outline-none focus:border-pup-maroon dark:focus:border-pup-gold text-gray-800 dark:text-white text-sm transition-all shadow-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-pup-gold mb-2 uppercase tracking-wider">Confirm Password</label>
                        <div class="relative">
                            <i class="ph-bold ph-check absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="password" v-model="confirmPassword" required placeholder="••••••••" class="w-full pl-11 pr-4 py-4 rounded-2xl bg-gray-50 dark:bg-[#111] border border-gray-200 dark:border-gray-800 focus:outline-none focus:border-pup-maroon dark:focus:border-pup-gold text-gray-800 dark:text-white text-sm transition-all shadow-sm">
                        </div>
                    </div>
                    <button type="submit" :disabled="isLoading" class="w-full py-4 rounded-2xl bg-green-600 hover:bg-green-700 dark:bg-pup-gold dark:hover:bg-yellow-600 text-white dark:text-black font-bold text-sm transition-all shadow-lg flex items-center justify-center gap-2 disabled:opacity-70">
                        <i v-if="isLoading" class="ph-bold ph-spinner animate-spin"></i>
                        <span>Change Password</span>
                    </button>
                </form>
            </div>

        </div>

        <!-- FOOTER LOGO -->
        <div class="mt-8 flex flex-col items-center gap-2 pb-10">
            <img src="{% static 'images/PUPLogo.png' %}" class="w-10 h-10 opacity-60">
            <p class="text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-[0.2em] text-center px-4">PUP UNISAN PORTAL SECURITY</p>
        </div>

    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            delimiters: ['[[', ']]'], 
            data() {
                return {
                    isDark: false,
                    step: 1,
                    isLoading: false,
                    identifier: '',
                    code: '',
                    newPassword: '',
                    confirmPassword: '',
                }
            },
            computed: {
                stepTitle() {
                    if (this.step === 1) return "Enter your student number or username to find your account.";
                    if (this.step === 2) return "A temporary code was sent to your email. Please enter it below.";
                    return "Almost done! Choose a strong new password for your account.";
                }
            },
            mounted() {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') { this.isDark = true; document.documentElement.classList.add('dark'); }
            },
            methods: {
                toggleTheme() {
                    this.isDark = !this.isDark;
                    document.documentElement.classList.toggle('dark', this.isDark);
                    localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
                },
                async submitIdentifier() {
                    this.isLoading = true;
                    const formData = new FormData();
                    formData.append('identifier', this.identifier);
                    const token = document.cookie.split('; ').find(row => row.startsWith('csrftoken=')).split('=')[1];
                    try {
                        const response = await fetch('/forgot-password/', { method: 'POST', headers: { 'X-CSRFToken': token }, body: formData });
                        const data = await response.json();
                        if (data.status === 'success') { alert(data.message); this.step = 2; }
                        else alert(data.message);
                    } catch (e) { alert("Server error."); }
                    finally { this.isLoading = false; }
                },
                async verifyCode() {
                    this.isLoading = true;
                    const formData = new FormData();
                    formData.append('code', this.code);
                    const token = document.cookie.split('; ').find(row => row.startsWith('csrftoken=')).split('=')[1];
                    try {
                        const response = await fetch('/api/verify-reset-code/', { method: 'POST', headers: { 'X-CSRFToken': token }, body: formData });
                        const data = await response.json();
                        if (data.status === 'success') this.step = 3;
                        else alert(data.message);
                    } catch (e) { alert("Server error."); }
                    finally { this.isLoading = false; }
                },
                async resetPassword() {
                    if (this.newPassword !== this.confirmPassword) { alert("Passwords do not match!"); return; }
                    this.isLoading = true;
                    const formData = new FormData();
                    formData.append('new_password', this.newPassword);
                    const token = document.cookie.split('; ').find(row => row.startsWith('csrftoken=')).split('=')[1];
                    try {
                        const response = await fetch('/api/complete-password-reset/', { method: 'POST', headers: { 'X-CSRFToken': token }, body: formData });
                        const data = await response.json();
                        if (data.status === 'success') { alert(data.message); window.location.href = '/'; }
                        else alert(data.message);
                    } catch (e) { alert("Server error."); }
                    finally { this.isLoading = false; }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
